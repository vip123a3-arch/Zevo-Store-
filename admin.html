<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEVO - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --text-color: #f1f1f1;
            --card-bg: #141419;
            --header-bg: #121217;
            --border-color: #262630;
            --accent-color: #d4af37;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 50px; }
        header { background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); }
        .back-store { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .admin-nav { display: flex; gap: 8px; margin-bottom: 20px; background: var(--card-bg); padding: 8px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 10px 15px; background: none; border: none; color: var(--text-color); font-weight: bold; font-size: 13px; cursor: pointer; border-radius: 8px; text-align: center; }
        .tab-btn.active { background-color: var(--accent-color); color: #000; }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
        h3 { margin-bottom: 15px; font-size: 18px; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: #aaa; font-weight: 600; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 14px; outline: none; }
        input[type="file"] { padding: 8px; cursor: pointer; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; text-align: center; }
        .btn-danger { background-color: #ff4757; color: #fff; }
        .btn-edit { background-color: #3498db; color: #fff; }
        .product-admin-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px; gap: 10px; }
        .product-admin-info { display: flex; align-items: center; gap: 12px; flex-grow: 1; overflow: hidden; }
        .product-admin-info img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .actions-group { display: flex; gap: 6px; }
        #custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 30px; box-shadow: var(--shadow); z-index: 3000; font-size: 14px; transition: transform 0.3s ease; }
        #custom-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZEVO Admin</div>
        <button class="back-store" onclick="window.location.href='index.html'"><i class="fa-solid fa-store"></i> المتجر</button>
    </header>

    <div class="container">
        <div class="admin-nav">
            <button class="tab-btn active" onclick="switchTab('products-tab', this)"><i class="fa-solid fa-box"></i> المنتجات</button>
            <button class="tab-btn" onclick="switchTab('add-tab', this)" id="add-tab-btn"><i class="fa-solid fa-plus-circle"></i> إضافة منتج</button>
            <button class="tab-btn" onclick="switchTab('settings-tab', this)"><i class="fa-solid fa-lock"></i> كلمة المرور</button>
        </div>

        <div id="products-tab" class="admin-section active">
            <div class="card">
                <h3>إدارة المنتجات</h3>
                <div id="admin-products-list"></div>
            </div>
        </div>

        <div id="add-tab" class="admin-section">
            <div class="card">
                <h3 id="form-title">إضافة تيشيرت جديد</h3>
                <input type="hidden" id="p-edit-id" value="">
                <div class="form-group"><label>اسم المنتج</label><input type="text" id="p-name" placeholder="مثال: تيشيرت اوفر سايز أسود"></div>
                <div class="row">
                    <div class="form-group"><label>السعر (EGP)</label><input type="number" id="p-price" placeholder="250"></div>
                    <div class="form-group"><label>السعر القديم (اختياري)</label><input type="number" id="p-old-price" placeholder="350"></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>الكمية المتاحة</label><input type="number" id="p-qty" placeholder="10"></div>
                    <div class="form-group"><label>المقاسات (بفاصلة)</label><input type="text" id="p-sizes" value="S, M, L, XL, XXL"></div>
                </div>
                <div class="form-group"><label>الألوان (بفاصلة)</label><input type="text" id="p-colors" value="أسود, أبيض, أزرق"></div>
                <div class="form-group"><label>الصورة الرئيسية</label><input type="file" id="p-img1-file" accept="image/*"></div>
                <div class="form-group"><label>الصورة الثانية (اختياري)</label><input type="file" id="p-img2-file" accept="image/*"></div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" id="save-btn" onclick="saveProduct()">حفظ وإضافة المنتج</button>
                    <button type="button" class="btn btn-danger" id="cancel-edit-btn" style="display: none; width: auto;" onclick="resetFormToAddNew()">إلغاء</button>
                </div>
            </div>
        </div>

        <div id="settings-tab" class="admin-section">
            <div class="card">
                <h3>تغيير كلمة مرور لوحة التحكم</h3>
                <div class="form-group"><label>كلمة المرور الجديدة</label><input type="text" id="new-admin-pass" placeholder="أدخل كلمة المرور الجديدة..."></div>
                <button type="button" class="btn" style="background: #3498db; color: #fff;" onclick="changeAdminPassword()">تحديث كلمة المرور</button>
            </div>
        </div>
    </div>

    <div id="custom-toast">تمت العملية بنجاح</div>
    <script src="admin.js"></script>
</body>
</html>
