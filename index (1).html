<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEVO Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .welcome-container {
            text-align: center;
            animation: cinematicZoom 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .welcome-container h1 {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }
        .welcome-shop-btn {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .welcome-shop-btn:hover {
            transform: scale(1.05);
            background-color: #f1c40f;
        }
        @keyframes cinematicZoom {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="welcome-screen">
        <div class="welcome-container">
            <h1>Welcome to ZEVO 🔥</h1>
            <button class="welcome-shop-btn" onclick="closeWelcomeScreen()">اضغط للتسوق</button>
        </div>
    </div>

    <header>
        <div class="logo" ondblclick="openAdminModal()">ZEVO Store</div>
        <div class="header-icons">
            <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
            <button class="icon-btn" onclick="openCartModal()"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cart-count">0</span></button>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ابحث عن تيشيرت..." oninput="renderProducts()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </div>

    <div class="store-header-info">
        <span id="products-count-text">المنتجات المتاحة</span>
        <button class="reset-filter" id="reset-filter-btn" onclick="resetFilter()" style="display: none;">عرض كل المنتجات</button>
    </div>

    <main class="products-grid" id="products-grid"></main>

    <div class="modal" id="options-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('options-modal')">&times;</button>
            <h3 style="margin-bottom: 15px; text-align: center; font-size: 18px;">اختر مواصفات المنتج</h3>
            <div class="modal-select-group">
                <label>اختر المقاس:</label>
                <select id="modal-size-select"></select>
            </div>
            <div class="modal-select-group">
                <label>اختر اللون:</label>
                <select id="modal-color-select"></select>
            </div>
            <button class="whatsapp-checkout-btn" style="background: #ff4757; margin-top: 5px;" onclick="confirmAddToCart()">تأكيد الإضافة للسلة</button>
        </div>
    </div>

    <div class="modal" id="admin-login-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('admin-login-modal')">&times;</button>
            <h3 style="margin-bottom: 10px;">لوحة تحكم الأدمن</h3>
            <input type="password" id="admin-pass-input" class="admin-login-input" placeholder="كلمة المرور...">
            <button class="whatsapp-checkout-btn" style="background: #d4af37 !important; color: #000000 !important; font-weight: bold;" onclick="verifyAdminPass()">دخول</button>
        </div>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('cart-modal')">&times;</button>
            <h3 style="margin-bottom: 15px; text-align: center;">سلة المشتريات</h3>
            <div id="cart-items-container" style="max-height: 40vh; overflow-y: auto;"></div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px; display: flex; justify-content: space-between; font-weight: bold;">
                <span>الإجمالي:</span>
                <span id="cart-total-price">EGP 0</span>
            </div>
            <button class="whatsapp-checkout-btn" onclick="checkoutWhatsApp()">اطلب عبر واتساب</button>
        </div>
    </div>

    <div id="custom-toast">تمت العملية بنجاح</div>

    <script src="script.js"></script>
</body>
</html>
